<div class="page-wrapper">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="container">
    <header class="nav-back-wrap">
      <a routerLink="/blogs" class="btn-back">
        <i class="bi bi-arrow-left"></i> Back to Articles
      </a>
    </header>

    @if (isLoading) 
    {
      <div class="status-state">
        <div class="spinner"></div>
        <p>Loading article content...</p>
      </div>
    } 
    @else if (errorMessage) 
    {
      <div class="status-state error-state">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <p>{{ errorMessage }}</p>
        <a routerLink="/blogs" class="btn-signup">Return to Blogs</a>
      </div>
    } 
    @else 
    {
      <article class="blog-article">
        
        <header class="article-header">
          <span class="category-badge" [appCategoryColor]="blog.categoryName">{{ blog.categoryName }}</span>
          <h1 class="article-title">{{ blog.title }}</h1>
          
          <div class="meta-profile">
            <div class="avatar-fallback">
              <i class="bi bi-person-fill"></i>
            </div>
            <div class="meta-info">
              <span class="author-name">By {{ blog.userName }}</span>
              <span class="publish-date">
                <i class="bi bi-calendar3"></i> 
                {{ blog.createdAt | date:'longDate' }}
              </span>
            </div>
          </div>
        </header>

        @if (blog.imageUrl) 
        {
          <div class="article-cover">
            <img [src]="domainUrl + blog.imageUrl" [alt]="blog.title" />
          </div>
        }

        <section class="article-body">
          <p class="content-text">{{ blog.content }}</p>
        </section>

      </article>
    }
  </div>
</div>
